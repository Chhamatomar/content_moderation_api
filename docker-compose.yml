services:
  db:
    image: postgres:16
    container_name: moderation-db-compose
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ContentModeration_db
    ports:
      - "5433:5432"
    volumes:
      - moderation_pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: content-moderation-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/ContentModeration_db
    ports:
      - "8080:8000"

volumes:
  moderation_pgdata: